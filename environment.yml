name: planttwin
channels:
  - nvidia
  - defaults
dependencies:
  - python=3.10
  # CUDA toolkit for compiling custom extensions. Match to the torch build below.
  #   - Ampere / Ada (A6000, A100, 4090, ...): cuda-toolkit=12.4  (this machine: 8x RTX A6000, sm_86)
  #   - Blackwell (RTX 50xx, sm_120):          cuda-toolkit=13.0
  - cuda-toolkit=12.4
  - pip:
    # --- Core: PyTorch --------------------------------------------------------
    # This machine (8x RTX A6000, sm_86, driver 535 -> CUDA 12.2): cu124 wheels.
    #   pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cu124
    # Blackwell (sm_120) instead needs: torch==2.12.0 torchvision==0.27.0 (cu130).
    - --extra-index-url https://download.pytorch.org/whl/cu124
    - torch==2.6.0
    - torchvision==0.21.0
    # Attention (version must match torch; 0.0.29.post3 pairs with torch 2.6)
    - xformers==0.0.29.post3
    # --- Scientific / geometry core ------------------------------------------
    - numpy
    - scipy
    - scikit-learn
    - matplotlib
    - pillow
    - imageio
    - imageio-ffmpeg
    - tqdm
    - easydict
    - opencv-python-headless
    - ninja
    - trimesh
    - open3d
    - plyfile
    - av
    - transformers
    - ftfy
    # --- Mesh / geometry extras (TRELLIS + GaussianPlant tooling) ------------
    - xatlas
    - pyvista
    - pymeshfix
    - igraph
    - rembg
    - onnxruntime
    - spconv-cu124
    # --- Video diffusion (data generation / SDS) -----------------------------
    - diffusers
    - accelerate
    # --- Differentiable physics ----------------------------------------------
    - taichi

# Custom CUDA extensions (install from source AFTER the env, with CUDA_HOME -> conda nvcc):
#   export CUDA_HOME=$CONDA_PREFIX
#   pip install <mip-splatting>/submodules/diff-gaussian-rasterization --no-build-isolation
#   pip install <diffoctreerast> --no-build-isolation
#   pip install <nvdiffrast>     --no-build-isolation
#   pip install git+https://github.com/EasternJournalist/utils3d.git@9a4eb15
#
# Notes:
# - Verified on: 8x RTX A6000 (Ampere sm_86), driver 535.146.02, torch 2.6.0+cu124.
# - Use ATTN_BACKEND=xformers (flash_attn prebuilt wheels not available for these torch builds).
# - kaolin not needed (FlexiCubes patched to remove dependency).
